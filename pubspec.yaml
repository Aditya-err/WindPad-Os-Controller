name: windpad
description: Windpad — Turn your phone into a Bluetooth HID Trackpad & Keyboard
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  android_intent_plus: ^6.0.0
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_rating_bar: ^4.0.1
  sensors_plus: ^7.0.0
  introduction_screen: ^4.0.0
  flutter_svg: ^2.2.4
  emoji_picker_flutter: ^4.4.0
  lottie: ^3.3.2
  animated_text_kit: ^4.2.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/windpad-icon.png"
  min_sdk_android: 21
  web:
    generate: false

  # Android adaptive icon — NO white background
  adaptive_icon_background: "#1565C0"  # blue matching the logo
  adaptive_icon_foreground: "assets/icon/windpad-icon-foreground.png"

  # Remove white padding — logo fills full icon
  remove_alpha_ios: false
  background_color: "#1565C0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/windpad-icon.png
    - assets/devices/
