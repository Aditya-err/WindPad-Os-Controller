name: Build Linux
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python deps
        run: |
          cd windpad-server
          pip install pyinstaller pillow qrcode zeroconf \
            pyperclip pystray python-xlib

      - name: Build with PyInstaller
        run: |
          cd windpad-server
          pyinstaller --onefile \
            --name="windpad-helper" \
            main.py

      - name: Create .deb
        run: |
          cd windpad-server
          fpm -s dir -t deb \
            -n windpad-helper \
            -v 1.0.0 \
            --description "Windpad Companion App" \
            --maintainer "Aditya" \
            dist/windpad-helper=/usr/local/bin/windpad-helper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindpadHelper-Linux
          path: windpad-server/windpad-helper_1.0.0_amd64.deb
