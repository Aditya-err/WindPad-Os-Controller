<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue background -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#5B9FF5"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>

    <!-- Key fill -->
    <linearGradient id="keyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Badge drop shadow -->
    <filter id="badgeDrop" x="-18%" y="-10%" width="136%" height="138%">
      <feDropShadow dx="2" dy="10" stdDeviation="11"
                    flood-color="#1A44BB" flood-opacity="0.30"/>
    </filter>

    <!-- Keyboard shadow -->
    <filter id="kbDrop" x="-6%" y="-4%" width="112%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18"
                    flood-color="#1A44AA" flood-opacity="0.42"/>
    </filter>

    <!-- Cursor 3D shadow -->
    <filter id="cursorShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="8"
                    flood-color="#00000055" flood-opacity="1"/>
    </filter>

    <clipPath id="cursorClip">
      <polygon points="
        224,90
        224,308
        258,270
        280,318
        302,308
        280,256
        336,256
      "/>
    </clipPath>
  </defs>

  <!-- ══ APP BACKGROUND ══ -->
  <rect width="512" height="512" rx="108" fill="url(#bgBlue)"/>
  <rect width="512" height="200" rx="108" fill="white" opacity="0.055"/>

  <!-- ══ KEYBOARD BODY ══ -->
  <rect x="42" y="274" width="428" height="196" rx="40"
        fill="#4285F4" filter="url(#kbDrop)"
        stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="42" y="274" width="428" height="20" rx="14"
        fill="white" opacity="0.22"/>

  <!-- Row 1 — Centered Perfectly (width total = 422, start = 45) -->
  <rect x="50"  y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="106" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="162" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="218" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="274" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="330" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="386" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="442" y="302" width="20" height="40" rx="9" fill="url(#keyFill)"/>

  <!-- Row 2 — Centered Perfectly (width total = 412, start = 50) -->
  <rect x="58"  y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="116" y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="174" y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="232" y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="290" y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="348" y="354" width="46" height="40" rx="9" fill="url(#keyFill)"/>
  <rect x="406" y="354" width="48" height="40" rx="9" fill="url(#keyFill)"/>

  <!-- Row 3 — Spacebar -->
  <rect x="104" y="404" width="304" height="42" rx="21" fill="url(#keyFill)"/>

  <!-- ══ WHITE TEARDROP BADGE ══ -->
  <path d="
    M 156,34
    Q 156,10 180,10
    L 332,10
    Q 356,10 356,34
    L 356,244
    Q 356,266 336,276
    L 272,310
    Q 256,319 240,310
    L 176,276
    Q 156,266 156,244
    Z
  " fill="white" filter="url(#badgeDrop)"/>

  <!-- Badge top inner highlight -->
  <path d="M 163,36 Q 163,18 180,18 L 332,18 Q 349,18 349,36
            L 349,44 Q 332,27 180,27 Q 163,27 163,44 Z"
        fill="white" opacity="0.50"/>

  <!-- Outer white stroke -->
  <polygon
    points="224,90 224,308 258,270 280,318 302,308 280,256 336,256"
    fill="none"
    stroke="white"
    stroke-width="10"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#cursorShadow)"
  />

  <!-- RED band -->
  <rect x="100" y="85" width="260" height="90" clip-path="url(#cursorClip)" fill="#EA4335"/>
  <!-- YELLOW band -->
  <rect x="100" y="175" width="260" height="65" clip-path="url(#cursorClip)" fill="#FBBC05"/>
  <!-- GREEN band -->
  <rect x="100" y="240" width="260" height="58" clip-path="url(#cursorClip)" fill="#34A853"/>
  <!-- BLUE band -->
  <rect x="100" y="298" width="260" height="26" clip-path="url(#cursorClip)" fill="#4285F4"/>

  <!-- Dividers -->
  <line x1="160" y1="175" x2="340" y2="175" clip-path="url(#cursorClip)" stroke="white" stroke-width="2.5" opacity="0.55"/>
  <line x1="160" y1="240" x2="340" y2="240" clip-path="url(#cursorClip)" stroke="white" stroke-width="2.5" opacity="0.55"/>
  <line x1="160" y1="298" x2="340" y2="298" clip-path="url(#cursorClip)" stroke="white" stroke-width="2.5" opacity="0.55"/>

  <!-- Left edge highlight -->
  <line x1="230" y1="96" x2="230" y2="302" clip-path="url(#cursorClip)" stroke="white" stroke-width="4" opacity="0.38" stroke-linecap="round"/>
</svg>
