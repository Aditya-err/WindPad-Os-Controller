  <rect x="80" y="92" width="16" height="6" rx="2" fill="#01579B"/>
  <defs>
    <linearGradient id="beamGrad" x1="46" y1="68" x2="4" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.85"/>
