name: windpad
description: Windpad — Turn your phone into a Bluetooth Trackpad & Keyboard
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  android_intent_plus: ^6.0.0
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/windpad-icon.png"
  min_sdk_android: 28
  remove_alpha_ios: true
  background_color_ios: "#6C3FF5"
  adaptive_icon_background: "#6C3FF5"
  adaptive_icon_foreground: "assets/icon/windpad-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/windpad-icon.png
