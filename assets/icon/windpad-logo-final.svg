<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue background -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#5B9FF5"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>

    <!-- Key fill -->
    <linearGradient id="keyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="badgeDrop" x="-18%" y="-10%" width="136%" height="138%">
      <feDropShadow dx="2" dy="10" stdDeviation="11" flood-color="#1A44BB" flood-opacity="0.30"/>
    </filter>
    <filter id="kbDrop" x="-6%" y="-4%" width="112%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1A44AA" flood-opacity="0.42"/>
    </filter>
    <filter id="cursorShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#00000055" flood-opacity="1"/>
    </filter>

    <clipPath id="cursorClip">
      <polygon points="256,90 256,308 290,270 312,318 334,308 312,256 368,256"/>
    </clipPath>
  </defs>

  <!-- ══ APP BACKGROUND ══ -->
  <rect width="512" height="512" rx="108" fill="url(#bgBlue)"/>
  <rect width="512" height="200" rx="108" fill="white" opacity="0.055"/>

  <!-- ══ KEYBOARD BODY ══ -->
  <rect x="42" y="274" width="428" height="196" rx="40" fill="#4285F4" filter="url(#kbDrop)" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="42" y="274" width="428" height="20" rx="14" fill="white" opacity="0.22"/>

  <!-- Row 1 — Aligned to Keyboard Body (Starts at 56, even spacing) -->
  <g opacity="0.9">
    <rect x="56"  y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="110" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="164" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="218" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="272" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="326" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="380" y="302" width="46" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="434" y="302" width="22" height="40" rx="9" fill="url(#keyFill)"/>
  </g>

  <!-- Row 2 -->
  <g opacity="0.9">
    <rect x="68"  y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="126" y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="184" y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="242" y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="300" y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="358" y="354" width="50" height="40" rx="9" fill="url(#keyFill)"/>
    <rect x="416" y="354" width="40" height="40" rx="9" fill="url(#keyFill)"/>
  </g>

  <!-- Spacebar -->
  <rect x="104" y="404" width="304" height="42" rx="21" fill="url(#keyFill)"/>

  <!-- ══ WHITE TEARDROP BADGE (Centered) ══ -->
  <path d="
    M 188,34
    Q 188,10 212,10
    L 300,10
    Q 324,10 324,34
    L 324,244
    Q 324,266 304,276
    L 272,310
    Q 256,319 240,310
    L 208,276
    Q 188,266 188,244
    Z
  " fill="white" filter="url(#badgeDrop)"/>

  <!-- ══ GOOGLE-COLORED CURSOR (Centered at 256) ══ -->
  <!-- Outer stroke -->
  <polygon points="256,90 256,308 290,270 312,318 334,308 312,256 368,256" fill="none" stroke="white" stroke-width="10" stroke-linejoin="round" filter="url(#cursorShadow)"/>

  <!-- Horizontal Bands as per user's logic -->
  <g clip-path="url(#cursorClip)">
    <rect x="200" y="85" width="200" height="90" fill="#EA4335"/>
    <rect x="200" y="175" width="200" height="65" fill="#FBBC05"/>
    <rect x="200" y="240" width="200" height="58" fill="#34A853"/>
    <rect x="200" y="298" width="200" height="26" fill="#4285F4"/>
  </g>

  <!-- Separator Lines -->
  <g clip-path="url(#cursorClip)" opacity="0.3">
    <line x1="200" y1="175" x2="400" y2="175" stroke="white" stroke-width="2"/>
    <line x1="200" y1="240" x2="400" y2="240" stroke="white" stroke-width="2"/>
    <line x1="200" y1="298" x2="400" y2="298" stroke="white" stroke-width="2"/>
  </g>

  <!-- Left Edge Highlight -->
  <line x1="262" y1="100" x2="262" y2="300" clip-path="url(#cursorClip)" stroke="white" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

</svg>
