  <rect x="22" y="48" width="88" height="40" rx="10" fill="#03A9F4"/>
  <!-- Lens Housing -->
  <circle cx="46" cy="68" r="18" fill="#E1F5FE"/>
  <circle cx="46" cy="68" r="14" fill="#01579B"/>
